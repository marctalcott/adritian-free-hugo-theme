# about
about:
  enable: true
  title: "Who am I?"
  content: >
    <p class="lead">
      <em>Builder.</em><br>
      I got my first computer in 1983 and have been writing code ever since. I studied Computer Science at UNCG and was inducted into the <a href="https://upe.acm.org/membership/">Upsilon Pi Epsilon</a> honor society for computing. I've shipped software professionally since 2000 — most recently leading Finance IT engineering at <a href="https://www.inmar.com">Inmar Intelligence</a>. These days I'm especially interested in <a href="https://www.eventstore.com/event-sourcing">event sourcing</a> and what it makes possible: perfect audit trails, replayable history, and the kind of systems-level reasoning that financial software demands. I'm putting that to work as the founder of <a href="https://ezley.com"><strong>Ezley</strong></a>, an event-sourced financial platform I'm building now.
    </p>
    <p class="lead">
    <em>Outside the code.</em><br>
      When I'm not in a terminal, I'm probably outside — practicing photography on the road or working the garden at home. What started as a pandemic-era hobby has grown into <em>Talcott Farm &amp; Nursery</em>, a small organic operation my wife and I run together. Different domain, same instinct: build something real, iterate, share what you learn.
    </p>

  button:
    icon: "icon-smile-fill"
    btnText: "About Me"
    URL: "https://www.linkedin.com/in/marc-talcott-csm-mcsd-a5617a33/"
  image:
    x: "images/who-am-i/marc.jpg"
    _2x: "images/who-am-i/marc.jpg"

